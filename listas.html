<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elemtos de lista</title>
</head>
<body>
    <h1>Elemtos de Listas</h1>
    <p>As <strong>listas</strong> em HTML são utilizadas para organizar informações em uma <strong>sequencia</strong></p>
<h3>lista não ordenada</h3>
    <ul>
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
    </ul>
<h3>lista ordenada</h3>
    <ol>
        <li>item1</li> 
        <li>item2</li> 
        <li>item3</li>   
    </ol>
    

</body>
</html>
