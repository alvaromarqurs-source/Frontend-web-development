<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript no head e no body</title>
    <style>
        .destaque {
            color: rgb(70, 102, 69);
            font-size: 30px;
            font-weight: bold;
        }
    </style>
    <script>
        alert("Caraca, javascript é tão legal! :)");
    </script>
</head>
<body>
    <h1>JavaScript incorporado</h1>
    <p>Este conteúdo foi escrito diretamente com o HTML</p>
    <script>
        document.write("<p class='destaque'>Este conteúdo foi criado pelo JavaScript</p>");
    </script>
</body>
</html>
