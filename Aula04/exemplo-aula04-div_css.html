<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Exemplo: div,br e hr</title>
   <style>
       div{
        font-size: 28px;
        text-align: center;
        padding: 20px;
        margin: 20px;
        border-radius: 10px;
       }
       #principal{
            background-color: rgb(97, 106, 230);
            border: 3px solid gray;
       }
       #secundaria{
            background-color: darkviolet;
            border: 3px solid grey
       }
       hr{
        border: none;
        border-top:3px solid black;
        width: 90%;

       }
   </style>


</head>
<body>
    <div id="principal">
        Esta é a primeira linha 
        <br>
        Esta é segunda linha
    </div>
    <hr>
    <div id="secundaria">
        Esta é outra divisão da pagina.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
</body>
</html>
